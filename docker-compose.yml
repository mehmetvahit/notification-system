services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_DSN=postgres://postgres:postgres@postgres:5432/notifications?sslmode=disable
      - REDIS_ADDR=redis:6379
      - WEBHOOK_URL=${WEBHOOK_URL}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - WORKERS_PER_CHANNEL=${WORKERS_PER_CHANNEL:-5}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_BASE_DELAY=${RETRY_BASE_DELAY:-1s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
